[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-urdu-translator"
version = "2.0.0"
description = "Portable English -> Roman Urdu translation agent for news cards, bots and automation. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["roman-urdu", "translation", "urdu", "news", "automation", "llm"]
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
roman-urdu = "roman_urdu_translator.cli:main"

[tool.setuptools]
packages = ["roman_urdu_translator"]

[tool.setuptools.package-data]
roman_urdu_translator = ["prompts/*.txt", "prompts/*.md", "config.example.json"]
