name: Breaking news bot

on:
  workflow_dispatch:         # manual run button in the Actions tab
    inputs:
      photo_test:
        description: "Post one test card with real article photos"
        type: boolean
        default: false
      manual_card:
        description: "Post the card in data/manual_card.json"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit data/posted.json
  actions: write             # needed to start the next run (self-restart chain)

concurrency:
  group: breaking-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POST_TO_FACEBOOK: ${{ vars.POST_TO_FACEBOOK || '1' }}   # set repo variable POST_TO_FACEBOOK to 0 to stop public Facebook posts
          POST_TO_INSTAGRAM: ${{ vars.POST_TO_INSTAGRAM || '1' }}   # set repo variable POST_TO_INSTAGRAM to 0 to stop Instagram posts
          RU_PROVIDER: openai
          RU_BASE_URL: https://api.groq.com/openai/v1
          RU_MODEL: llama-3.3-70b-versatile
          RU_API_KEY: ${{ secrets.RU_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY || secrets.XAI_API_KEY }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '60' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GEMINI_WRITE_MODEL: ${{ vars.GEMINI_WRITE_MODEL || 'gemini-flash-latest' }}
          TEST_WRITE: ${{ vars.TEST_WRITE || '0' }}
          DIAG: ${{ vars.DIAG || '0' }}
          PHOTO_TEST: ${{ inputs.photo_test && '1' || '0' }}
          MANUAL_CARD: ${{ inputs.manual_card && '1' || '0' }}
          CARD_CHECK: ${{ vars.CARD_CHECK || '0' }}
          CARD_PUBLISH: ${{ vars.CARD_PUBLISH || '0' }}
          REPOST: ${{ vars.REPOST || '0' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '2' }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '8' }}
          MIN_SOURCES: ${{ vars.MIN_SOURCES || '2' }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}   # set repo variable DRY_RUN to 0 to go live
        run: python scripts/news_bot.py

      - name: Save posted record
        run: |
          git config user.name "breaking-news-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/state
          cp data/posted.json data/seen.json data/ai_usage.json data/ig_pending.json /tmp/state/
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/state/posted.json /tmp/state/seen.json /tmp/state/ai_usage.json /tmp/state/ig_pending.json data/
            git add data/posted.json data/seen.json data/ai_usage.json data/ig_pending.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update posted record"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  # Self-restart: after the bot run, wait about 25 minutes and start the next run.
  # Stop the chain by setting repo variable CHAIN to 0 (or by disabling the workflow).
  next:
    needs: run
    if: always() && (vars.CHAIN || '1') != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ vars.CHAIN || '1' }}
        run: |
          if [ "$CHAIN" != "1" ]; then echo "Chain stopped (CHAIN=$CHAIN)"; exit 0; fi
          sleep 1500
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/breaking-news.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run requested"
