name: Breaking news bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, UTC (GitHub may delay runs a few minutes)
  workflow_dispatch: {}      # manual run button in the Actions tab

permissions:
  contents: write            # needed to commit data/posted.json

concurrency:
  group: breaking-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GEMINI_WRITE_MODEL: ${{ vars.GEMINI_WRITE_MODEL || 'gemini-flash-latest' }}
          TEST_WRITE: ${{ vars.TEST_WRITE || '0' }}
          DIAG: ${{ vars.DIAG || '0' }}
          CARD_CHECK: ${{ vars.CARD_CHECK || '0' }}
          CARD_PUBLISH: ${{ vars.CARD_PUBLISH || '0' }}
          REPOST: ${{ vars.REPOST || '0' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '2' }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '8' }}
          MIN_SOURCES: ${{ vars.MIN_SOURCES || '2' }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}   # set repo variable DRY_RUN to 0 to go live
        run: python scripts/news_bot.py

      - name: Save posted record
        run: |
          git config user.name "breaking-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted.json data/seen.json data/ai_usage.json
          git diff --cached --quiet || (git commit -m "Update posted record" && git push)
